services:
  - type: web
    name: campuseats-api-it24101927
    runtime: docker
    plan: free
    rootDir: CampusEats.Api
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__Default
        sync: false
      - key: Jwt__Key
        generateValue: true
      - key: Jwt__Issuer
        value: CampusEats
      - key: Jwt__Audience
        value: CampusEatsUsers
      - key: Cors__AllowedOrigins__0
        sync: false
      - key: Database__ApplyMigrations
        value: "true"
      - key: Database__SeedMenu
        value: "true"
